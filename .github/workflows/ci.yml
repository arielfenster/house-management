name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  db-types:
    name: Database types up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit
      - run: npm run db:types:check

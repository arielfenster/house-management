name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # postinstall runs `nuxt prepare` (generates .nuxt, incl. the ESLint config).
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  db:
    name: DB types, tests, build, e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Local Supabase stack (Postgres, Auth, REST) with all migrations applied.
      - run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit
      - name: Export local Supabase keys
        run: |
          npx supabase status -o env \
            | sed -n -e 's/^API_URL=/SUPABASE_URL=/p' -e 's/^PUBLISHABLE_KEY=/SUPABASE_KEY=/p' -e 's/^SECRET_KEY=/SUPABASE_SECRET_KEY=/p' \
            | tr -d '"' >> "$GITHUB_ENV"

      - run: npm run db:types:check
      - run: npm test

      - run: npm run build
      - name: Service role key absent from client bundle
        run: |
          if grep -rqF "$SUPABASE_SECRET_KEY" .output/public; then
            echo "::error::SUPABASE_SECRET_KEY found in .output/public"
            exit 1
          fi

      - run: npx playwright install --with-deps chromium
      # Uses the build above (playwright.config.ts skips `nuxt build` when CI is set).
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
